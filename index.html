<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Variant Generator</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
    padding:30px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:#1e293b;
    padding:25px;
    border-radius:18px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.rule{
    background:#334155;
    padding:12px;
    border-radius:10px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#4f46e5;
    color:white;
    font-size:16px;
    cursor:pointer;
    margin-top:20px;
}

pre{
    background:#111827;
    padding:15px;
    border-radius:10px;
    margin-top:20px;
    max-height:300px;
    overflow:auto;
}
</style>
</head>
<body>

<div class="container">

<div class="card">

<h1>Password Variant Generator</h1>

<input type="file" id="fileInput">

<h2>Chọn Rules</h2>

<div class="grid">

<label class="rule">
<input type="checkbox" value="case">
 Viết thường/hoa/chữ cái đầu
</label>

<label class="rule">
<input type="checkbox" value="number">
 Thêm số phổ biến
</label>

<label class="rule">
<input type="checkbox" value="year">
 Thêm năm
</label>

<label class="rule">
<input type="checkbox" value="special">
 Ký tự đặc biệt
</label>

<label class="rule">
<input type="checkbox" value="suffix">
 Hậu tố VN
</label>

<label class="rule">
<input type="checkbox" value="leet">
 Leet speak
</label>

<label class="rule">
<input type="checkbox" value="separator">
 Dấu phân cách
</label>

<label class="rule">
<input type="checkbox" value="reverse">
 Đảo ngược
</label>

<label class="rule">
<input type="checkbox" value="double">
 Nhân đôi
</label>

<label class="rule">
<input type="checkbox" value="username">
 Biến đổi username
</label>

</div>

<button onclick="runTool()">
RUN TOOL
</button>

<pre id="output"></pre>

</div>

</div>

<script>

const MAX_LEN = 18;

function tokenize(pwd){
    return pwd.match(/[A-Za-z]+|\\d+|[^A-Za-z0-9]/g) || [];
}

function validVariant(v, original){

    if(!v || v === original) return false;

    if(v.length > MAX_LEN) return false;

    if(/^(.)\\1+$/.test(v)) return false;

    return true;
}

function download(content,name){

    const blob = new Blob([content], {type:"text/plain"});

    const a = document.createElement("a");

    a.href = URL.createObjectURL(blob);

    a.download = name;

    a.click();
}

async function runTool(){

    const file = document.getElementById("fileInput").files[0];

    if(!file){
        alert("Chọn file TXT");
        return;
    }

    const text = await file.text();

    const lines = text.split(/\\r?\\n/);

    const rules = [...document.querySelectorAll("input[type=checkbox]:checked")]
    .map(x=>x.value);

    let output = [];

    for(const line of lines){

        if(!line.includes(":")) continue;

        const parts = line.split(":");

        const user = parts[0];

        const pwd = parts.slice(1).join(":");

        const tokens = tokenize(pwd);

        let variants = [];

        if(rules.includes("case")){

            const word = tokens.join("");

            variants.push(
                word.toLowerCase(),
                word.toUpperCase(),
                word.charAt(0).toUpperCase()+word.slice(1)
            );
        }

        if(rules.includes("number")){

            ["123","1234","1111","9999"]
            .forEach(n=>variants.push(tokens.join("")+n));
        }

        if(rules.includes("year")){

            ["1990","2000","2020","90"]
            .forEach(y=>variants.push(tokens.join("")+y));
        }

        if(rules.includes("special")){

            ["@","@@","!"]
            .forEach(s=>variants.push(tokens.join("")+s));
        }

        if(rules.includes("suffix")){

            ["vip","pro","cute","love"]
            .forEach(s=>variants.push(tokens.join("")+s));
        }

        if(rules.includes("leet")){

            variants.push(
                tokens.join("")
                .replace(/a/g,"@")
                .replace(/o/g,"0")
                .replace(/i/g,"1")
                .replace(/e/g,"3")
            );
        }

        if(rules.includes("separator")){

            const word = tokens.join("");

            const m = word.match(/^([A-Za-z]+)(\\d+)$/);

            if(m){

                variants.push(
                    m[1]+"_"+m[2],
                    m[1]+"-"+m[2],
                    m[1]+"."+m[2]
                );
            }
        }

        if(rules.includes("reverse")){

            variants.push(tokens.join("").split("").reverse().join(""));
        }

        if(rules.includes("double")){

            const word = tokens.join("");

            if(word.length < 8){

                variants.push(word+word);
            }
        }

        if(rules.includes("username")){

            const base = user.split("@")[0];

            variants.push(
                base+"123",
                base+"@",
                base+"1999"
            );
        }

        for(const v of variants){

            if(validVariant(v,pwd)){

                output.push(user+":"+v);
            }
        }
    }

    output = [...new Set(output)];

    document.getElementById("output").textContent =
        "Generated: " + output.length;

    download(output.join("\\n"),"ket_qua.txt");
}

</script>

</body>
</html>
