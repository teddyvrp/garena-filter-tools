
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate TXT Suite</title>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;margin:0;padding:20px}
.container{max-width:1100px;margin:auto}
.card{background:#1e293b;padding:20px;border-radius:16px;margin-bottom:20px}
input,textarea,button,select{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:none;box-sizing:border-box}
button{background:#2563eb;color:#fff;cursor:pointer}
button:hover{background:#1d4ed8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
pre{white-space:pre-wrap;background:#111827;padding:10px;border-radius:10px}
</style>
</head>
<body>
<div class="container">
<h1>Ultimate TXT Suite</h1>

<div class="grid">

<div class="card">
<h2>Filter Domain + Remove Duplicate</h2>
<input type="file" id="filterFile" multiple accept=".txt">
<textarea id="domains">garena
facebook
riot
steam</textarea>
<button onclick="runFilter()">Run Filter</button>
<pre id="filterInfo"></pre>
</div>

<div class="card">
<h2>TXT Splitter</h2>
<input type="file" id="splitFile" accept=".txt">
<select id="splitMode">
<option value="lines">Theo số dòng</option>
<option value="parts">Theo số file</option>
</select>
<input type="number" id="splitValue" value="5">
<button onclick="runSplit()">Split TXT</button>
<pre id="splitInfo"></pre>
</div>

<div class="card">
<h2>Format Converter</h2>
<input type="file" id="convertFile" accept=".txt">
<select id="convertType">
<option value="emailpass">email:pass</option>
<option value="userpass">user:pass</option>
</select>
<button onclick="convertFormat()">Convert</button>
<pre id="convertInfo"></pre>
</div>

<div class="card">
<h2>Search / Sort</h2>
<input type="file" id="searchFile" accept=".txt">
<input type="text" id="keyword" placeholder="Nhập keyword">
<button onclick="searchTxt()">Search</button>
<pre id="searchInfo"></pre>
</div>

</div>
</div>

<script>
function download(content,name){
 const blob=new Blob([content],{type:"text/plain"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download=name;
 a.click();
}

async function runFilter(){
 const files=document.getElementById("filterFile").files;
 const domains=document.getElementById("domains").value.toLowerCase().split("\n");
 let set=new Set();
 let total=0;

 for(const file of files){
   const text=await file.text();
   const lines=text.split(/\r?\n/);
   total+=lines.length;

   for(const line of lines){
     const low=line.toLowerCase();
     if(domains.some(d=>low.includes(d))){
       const p=line.split(":");
       if(p.length>=2){
         set.add(p.slice(-2).join(":"));
       }
     }
   }
 }

 download([...set].join("\n"),"filtered.txt");

 document.getElementById("filterInfo").textContent=
 "Total lines: "+total+"\nFiltered: "+set.size;
}

async function runSplit(){
 const file=document.getElementById("splitFile").files[0];
 const mode=document.getElementById("splitMode").value;
 const val=parseInt(document.getElementById("splitValue").value);

 const text=await file.text();
 const lines=text.split(/\r?\n/);

 let chunk=val;

 if(mode==="parts"){
   chunk=Math.ceil(lines.length/val);
 }

 for(let i=0;i<lines.length;i+=chunk){
   download(
    lines.slice(i,i+chunk).join("\n"),
    "part_"+(Math.floor(i/chunk)+1)+".txt"
   );
 }

 document.getElementById("splitInfo").textContent="Done!";
}

async function convertFormat(){
 const file=document.getElementById("convertFile").files[0];
 const type=document.getElementById("convertType").value;

 const text=await file.text();
 const lines=text.split(/\r?\n/);

 let out=[];

 for(const line of lines){
   const p=line.split(":");
   if(type==="emailpass" && p.length>=2){
      out.push(p[0]+":"+p[1]);
   }
   if(type==="userpass" && p.length>=2){
      out.push(p[p.length-2]+":"+p[p.length-1]);
   }
 }

 download(out.join("\n"),"converted.txt");

 document.getElementById("convertInfo").textContent=
 "Converted: "+out.length;
}

async function searchTxt(){
 const file=document.getElementById("searchFile").files[0];
 const keyword=document.getElementById("keyword").value.toLowerCase();

 const text=await file.text();

 const result=text
   .split(/\r?\n/)
   .filter(x=>x.toLowerCase().includes(keyword));

 download(result.join("\n"),"search_result.txt");

 document.getElementById("searchInfo").textContent=
 "Found: "+result.length;
}
</script>
</body>
</html>
